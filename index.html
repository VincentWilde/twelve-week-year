<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anno di 12 Settimane</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="12 Settimane">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* V2 — una colonna centrata come la schermata di blocco:
   data e ora reali → data equivalente in grande → striscia 12 settimane → giorni della settimana → tre numeri */
:root {
  --bg: #f3f4f7;
  --fg: #16181d;
  --muted: #727788;
  --track: #dcdfe7;
  --accent: #2f5bff;
  --rest: #b07a1c;
  --display: "Schibsted Grotesk", "SF Pro Display", system-ui, sans-serif;
  --body: "Inter", -apple-system, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d0f14; --fg: #eef0f5; --muted: #8d93a3; --track: #2a2e39; --accent: #7c98ff; --rest: #e0b25e; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; text-align: center; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* Oggi (invariato dalla v1) */
.date { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--muted); }
.date::first-letter { text-transform: uppercase; }
.clock { font-family: var(--display); font-weight: 800; font-size: clamp(64px, 22vw, 104px); line-height: 1; letter-spacing: -.02em; }

/* Data equivalente */
.hero { margin-top: 48px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.eq { font-family: var(--display); font-weight: 800; font-size: clamp(42px, 13.5vw, 68px); line-height: 1.02; letter-spacing: -.02em; color: var(--accent); white-space: nowrap; }
.wk { font-size: 17px; font-weight: 500; }
.wk b { font-weight: 600; }
.is-rest .eq { color: var(--rest); }

/* Striscia 12 settimane */
.strip { margin-top: 32px; width: 100%; display: grid; grid-template-columns: repeat(12, 1fr) 10px; gap: 5px; align-items: center; }
.strip i { height: 8px; border-radius: 4px; background: var(--track); position: relative; overflow: hidden; }
.strip i.done { background: var(--fg); }
.strip i.now::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--p, 0%); background: var(--accent); border-radius: 4px; }
.strip i.r13 { height: 10px; width: 10px; border-radius: 50%; }
.is-rest .strip i.r13 { background: var(--rest); }
.strip-legend { width: 100%; display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--muted); }

/* Giorni della settimana in corso */
.days { margin-top: 32px; width: 100%; display: grid; grid-template-columns: repeat(var(--n, 7), 1fr); gap: 4px; }
.days span { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.days b { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: 600; color: var(--fg); }
.days .gone b { color: var(--muted); }
.days .on b { background: var(--accent); color: #fff; }

/* Tre numeri */
.stats { margin-top: 36px; width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); padding-top: 18px; border-top: 1px solid var(--track); }
.stats div { display: flex; flex-direction: column; gap: 4px; }
.stats b { font-family: var(--display); font-size: 22px; font-weight: 700; }

.more { margin-top: 36px; font-size: 13px; color: var(--muted); text-decoration: none; }
.more:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
</style>
</head>
<body>
<main class="wrap" id="app">
  <div class="date" id="todayDate">domenica 15 novembre</div>
  <div class="clock num" id="clock">01:04</div>

  <section class="hero" aria-live="polite">
    <div class="label">Anno di 12 settimane</div>
    <div class="eq num" id="eq">15 luglio</div>
    <div class="wk num" id="wk"><b>Settimana 7</b> di 12 · giorno 4</div>
  </section>

  <div class="strip" id="strip" aria-hidden="true"></div>
  <div class="strip-legend num"><span id="qStart">1 ott</span><span id="qName">Q4</span><span id="qEnd">23 dic</span></div>

  <div class="days" id="days"></div>

  <div class="stats">
    <div><span class="label">Trascorso</span><b class="num" id="stPct">53%</b></div>
    <div><span class="label">Mancano</span><b class="num" id="stLeft">39 g</b></div>
    <div><span class="label">Fine ciclo</span><b class="num" id="stEnd">23 dic</b></div>
  </div>

  <a class="more" href="widget.html">Widget per la schermata di blocco</a>
</main>

<script>
(() => {
  const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
  const GG = ["D","L","M","M","G","V","S"];
  const DAY = 86400000;
  const $ = id => document.getElementById(id);
  const utc = (y, m, d) => Date.UTC(y, m, d);
  const short = t => { const d = new Date(t); return d.getUTCDate() + " " + MESI[d.getUTCMonth()].slice(0, 3); };

  function render() {
    const n = new Date();
    const y = n.getFullYear(), m = n.getMonth(), d = n.getDate();
    const sec = (n.getHours() * 3600 + n.getMinutes() * 60 + n.getSeconds()) / 86400;

    $("todayDate").textContent = n.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" });
    $("clock").textContent = n.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });

    // Ciclo = trimestre solare. Settimane contate dal 1° giorno del trimestre.
    const q = Math.floor(m / 3);
    const qs = utc(y, q * 3, 1), qe = utc(y, q * 3 + 3, 1);
    const qLen = Math.round((qe - qs) / DAY);
    const idx = Math.round((utc(y, m, d) - qs) / DAY);
    const week = Math.min(13, Math.floor(idx / 7) + 1);
    const rest = week === 13;
    $("app").classList.toggle("is-rest", rest);

    if (rest) {
      $("eq").textContent = "Revisione";
      $("wk").innerHTML = "<b>Settimana 13</b> · giorno " + (idx - 83) + " di " + (qLen - 84);
    } else {
      const frac = (idx + sec) / 84;
      const yLen = Math.round((utc(y + 1, 0, 1) - utc(y, 0, 1)) / DAY);
      const e = new Date(utc(y, 0, 1) + Math.min(yLen - 1, Math.floor(frac * yLen)) * DAY);
      $("eq").textContent = e.getUTCDate() + " " + MESI[e.getUTCMonth()];
      $("wk").innerHTML = "<b>Settimana " + week + "</b> di 12 · giorno " + (idx % 7 + 1);
    }

    // Striscia
    const strip = $("strip"); strip.innerHTML = "";
    for (let w = 1; w <= 13; w++) {
      const i = document.createElement("i");
      if (w === 13) i.className = "r13";
      else if (w < week) i.className = "done";
      else if (w === week) { i.className = "now"; i.style.setProperty("--p", Math.round(((idx % 7 + sec) / 7) * 100) + "%"); }
      strip.appendChild(i);
    }
    $("qStart").textContent = short(qs);
    $("qName").textContent = "Q" + (q + 1) + " " + y;
    $("qEnd").textContent = short(qs + 83 * DAY);

    // Giorni della settimana in corso
    const ws = qs + (week - 1) * 7 * DAY;
    const we = rest ? qe - DAY : ws + 6 * DAY;
    const today = utc(y, m, d);
    const days = $("days"); days.innerHTML = "";
    const count = Math.round((we - ws) / DAY) + 1;
    days.style.setProperty("--n", count);
    for (let t = ws; t <= we; t += DAY) {
      const dt = new Date(t), s = document.createElement("span");
      if (t === today) s.className = "on"; else if (t < today) s.className = "gone";
      s.innerHTML = GG[dt.getUTCDay()] + "<b class='num'>" + dt.getUTCDate() + "</b>";
      days.appendChild(s);
    }

    // Tre numeri
    $("stPct").textContent = (rest ? 100 : Math.floor(((idx + sec) / 84) * 100)) + "%";
    $("stLeft").textContent = rest ? "—" : (84 - idx) + " g";
    $("stEnd").textContent = short(qs + 83 * DAY);
  }

  render();
  setInterval(render, 20000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
})();
</script>
</body>
</html>
